<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>GTA VI — Vice Beach (Browser Edition)</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🌴</text></svg>"/>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05060a;
    font-family:"Avenir Next","Segoe UI",Helvetica,Arial,sans-serif;user-select:none}
  #c{display:block;width:100vw;height:100vh;background:#02040b;
    filter:saturate(1.08) contrast(1.04)}
  #grade,#vignette,#speedFX{position:fixed;inset:0;pointer-events:none}
  #grade{z-index:1;mix-blend-mode:soft-light;opacity:.4;
    background:
      linear-gradient(135deg,rgba(255,110,80,.34),rgba(0,230,255,.18) 45%,rgba(255,80,180,.18)),
      radial-gradient(circle at 72% 18%,rgba(255,220,110,.18),transparent 28%)}
  #vignette{z-index:2;opacity:.68;
    background:
      radial-gradient(circle at 50% 47%,transparent 34%,rgba(1,3,9,.25) 76%,rgba(0,0,0,.5)),
      linear-gradient(180deg,rgba(255,255,255,.05),transparent 18%,transparent 74%,rgba(0,0,0,.14))}
  #speedFX{z-index:3;opacity:0;mix-blend-mode:screen;transition:opacity .12s;
    background:
      repeating-linear-gradient(90deg,transparent 0 11vw,rgba(160,220,255,.12) 11.4vw 11.8vw,transparent 12.2vw 23vw),
      radial-gradient(ellipse at 50% 58%,transparent 30%,rgba(130,210,255,.14) 56%,transparent 72%)}
  #hud{position:fixed;inset:0;pointer-events:none;color:#fff;z-index:4}
  #minimap{position:absolute;left:18px;bottom:18px;width:180px;height:180px;
    border:1px solid rgba(255,255,255,.72);border-radius:8px;background:#123;
    box-shadow:0 16px 45px rgba(0,0,0,.48),inset 0 0 0 4px rgba(255,255,255,.1);
    backdrop-filter:blur(10px)}
  #stats{position:absolute;top:14px;right:20px;text-align:right;
    text-shadow:0 2px 4px rgba(0,0,0,.8);padding:10px 12px 11px;border-radius:8px;
    background:linear-gradient(180deg,rgba(6,10,20,.45),rgba(6,10,20,.18));
    border:1px solid rgba(255,255,255,.12);box-shadow:0 12px 36px rgba(0,0,0,.28);
    backdrop-filter:blur(9px)}
  #money{font-size:32px;font-weight:900;color:#74f27b;font-style:italic;
    filter:drop-shadow(0 0 8px rgba(90,255,120,.42))}
  #stars{font-size:24px;color:#ffd23e;letter-spacing:2px;margin-top:2px;
    filter:drop-shadow(0 0 6px rgba(255,210,62,.28))}
  #healthwrap,#carwrap{width:174px;height:10px;background:rgba(4,6,12,.68);
    border:1px solid rgba(255,255,255,.44);border-radius:7px;margin:7px 0 0 auto;overflow:hidden;
    box-shadow:inset 0 1px 6px rgba(0,0,0,.65)}
  #healthbar{height:100%;width:100%;background:linear-gradient(90deg,#ff4066,#ff8a6b)}
  #carbar{height:100%;width:100%;background:linear-gradient(90deg,#33bbff,#8f6aff)}
  #weapon{font-size:13px;font-weight:800;color:#ffe27a;margin-top:7px;
    text-shadow:0 2px 4px rgba(0,0,0,.8)}
  #speedo{position:absolute;right:24px;bottom:22px;font-size:42px;font-weight:900;
    font-style:italic;text-shadow:0 2px 6px rgba(0,0,0,.9),0 0 22px rgba(80,190,255,.28);display:none}
  #speedo span{font-size:15px;font-weight:700;letter-spacing:.04em}
  #missionText{position:absolute;top:14px;left:50%;transform:translateX(-50%);
    font-size:17px;font-weight:800;color:#b9f2ff;text-shadow:0 2px 4px rgba(0,0,0,.9),0 0 12px rgba(80,220,255,.5);
    background:linear-gradient(180deg,rgba(5,12,28,.66),rgba(5,12,28,.36));padding:7px 17px;border-radius:8px;
    border:1px solid rgba(140,230,255,.22);box-shadow:0 14px 34px rgba(0,0,0,.3);max-width:70vw;text-align:center;
    backdrop-filter:blur(9px)}
  #storyText{position:absolute;top:62px;left:18px;width:280px;max-width:28vw;
    font-size:13px;line-height:1.35;font-weight:600;color:#d9f2ff;text-shadow:0 2px 4px rgba(0,0,0,.9);
    background:linear-gradient(180deg,rgba(4,9,22,.7),rgba(4,9,22,.42));border-left:3px solid #33bbff;padding:8px 10px;border-radius:6px;
    box-shadow:0 4px 14px rgba(0,0,0,.35);opacity:0;transition:opacity .35s}
  #toast{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);
    font-size:22px;font-weight:900;color:#ffe9a0;text-shadow:0 2px 5px #000,0 0 18px rgba(255,210,90,.45);
    opacity:0;transition:opacity .3s}
  #hint{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);
    font-size:14px;color:rgba(255,255,255,.85);text-shadow:0 1px 3px #000}
  #bigmsg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:9vw;font-weight:900;font-style:italic;letter-spacing:.05em;
    color:#d22;text-shadow:0 0 30px rgba(0,0,0,.9),0 6px 10px #000;
    background:rgba(0,0,0,0);opacity:0;transition:opacity .6s;pointer-events:none}
  #screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;background:#070913 url("spot-beach.png") center/cover no-repeat;
    color:#fff;cursor:pointer;z-index:10;overflow:hidden}
  #screen::before{content:"";position:absolute;inset:0;background:
    linear-gradient(90deg,rgba(0,0,0,.72),rgba(0,0,0,.18) 46%,rgba(0,0,0,.7)),
    radial-gradient(circle at 50% 36%,rgba(255,148,90,.18),transparent 36%);
    pointer-events:none}
  #screen::after{content:"";position:absolute;inset:0;background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 4px);
    opacity:.16;mix-blend-mode:overlay;pointer-events:none}
  #screen h1{position:relative;font-size:clamp(44px,8vw,94px);margin:0;font-weight:900;font-style:italic;letter-spacing:0;
    background:linear-gradient(180deg,#ff7ad9 0%,#ffb46b 55%,#ffe27a 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 14px rgba(255,122,217,.45))}
  #screen h2{position:relative;font-weight:800;letter-spacing:.36em;color:#8fd8ff;margin:6px 0 22px;font-size:15px;
    text-shadow:0 0 14px rgba(80,210,255,.58)}
  #screen .ctl{position:relative;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;color:#dcecff;font-size:12px;
    letter-spacing:.16em;font-weight:800;text-transform:uppercase}
  #screen .ctl span{border:1px solid rgba(255,255,255,.24);border-radius:999px;padding:7px 10px;
    background:rgba(0,0,0,.28);backdrop-filter:blur(8px)}
  #screen .go{position:relative;margin-top:34px;font-size:22px;font-weight:900;color:#ffe27a;
    text-shadow:0 0 16px rgba(255,226,122,.42);animation:pulse 1.2s infinite}
  #screen .credit{position:absolute;bottom:14px;font-size:12px;color:rgba(230,230,255,.62)}
  @media (max-width:640px){
    #storyText{top:auto;bottom:214px;left:14px;width:170px;max-width:44vw;
      font-size:12px;padding:7px 8px}
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="grade"></div>
<div id="vignette"></div>
<div id="speedFX"></div>
<div id="hud">
  <canvas id="minimap" width="180" height="180"></canvas>
  <div id="stats">
    <div id="money">$0</div>
    <div id="stars"></div>
    <div id="healthwrap"><div id="healthbar"></div></div>
    <div id="carwrap" style="display:none"><div id="carbar"></div></div>
    <div id="weapon"></div>
  </div>
  <div id="speedo">0 <span>km/h</span></div>
  <div id="missionText"></div>
  <div id="storyText"></div>
  <div id="toast"></div>
  <div id="hint"></div>
</div>
<div id="bigmsg"></div>
<div id="screen">
  <h1>GRAND THEFT AUTO VI</h1>
  <h2>VICE BEACH</h2>
  <div class="ctl">
    <span>Vice Beach</span>
    <span>Noon to Neon</span>
    <span>West Atlantic</span>
  </div>
  <div class="go">CLICK TO PLAY</div>
  <div class="credit">An unofficial fan-made browser demo.</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {SMAAPass} from 'three/addons/postprocessing/SMAAPass.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';

// ---------------------------------------------------------------- constants
const GRID = 10;            // blocks per side
const P    = 86;            // road pitch (block 70 + road 16)
const RH   = 8;             // road half-width
const R0   = -GRID*P/2;     // first road line = -430
const roadAt = i => R0 + i*P;
const CITY = GRID*P/2 + RH; // 438 = paved extent
const WORLD = 1100;         // ground plane size
const BOUND = 465;
const DAY_LEN = 110;        // seconds per full day
const KMH_PER_SPEED = 4;
const TIRE_SMOKE_MIN_KMH = 105;

const rand  = (a,b)=>a+Math.random()*(b-a);
const irand = (a,b)=>Math.floor(rand(a,b+1));
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const pick  = a=>a[Math.floor(Math.random()*a.length)];
function angLerp(a,b,t){const d=Math.atan2(Math.sin(b-a),Math.cos(b-a));return a+d*Math.min(1,t);}
const fwdOf = th => new THREE.Vector3(Math.sin(th),0,Math.cos(th));

// ---------------------------------------------------------------- renderer
const MOBILE = matchMedia('(max-width: 760px), (pointer: coarse)').matches;
const MAX_DPR = Math.min(devicePixelRatio || 1,MOBILE?1.25:1.65);
let renderDpr = MAX_DPR;
const renderer = new THREE.WebGLRenderer({
  canvas:document.getElementById('c'),antialias:true,powerPreference:'high-performance'
});
renderer.setPixelRatio(renderDpr);
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b5e8);
scene.fog = new THREE.Fog(0x87b5e8,140,520);

const camera = new THREE.PerspectiveCamera(62,innerWidth/innerHeight,0.1,2000);
camera.position.set(20,12,30);

const composer = new EffectComposer(renderer);
composer.setPixelRatio(renderDpr);
composer.setSize(innerWidth,innerHeight);
composer.addPass(new RenderPass(scene,camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.35,0.55,0.85);
composer.addPass(bloomPass);
const smaaPass = new SMAAPass(innerWidth*renderDpr,innerHeight*renderDpr);
composer.addPass(smaaPass);
composer.addPass(new OutputPass());

const perf = {t:0,frames:0,cooldown:0};
function setRenderQuality(dpr=renderDpr){
  renderDpr = clamp(dpr,0.85,MAX_DPR);
  renderer.setPixelRatio(renderDpr);
  renderer.setSize(innerWidth,innerHeight,false);
  composer.setPixelRatio(renderDpr);
  composer.setSize(innerWidth,innerHeight);
  if(smaaPass.setSize) smaaPass.setSize(innerWidth*renderDpr,innerHeight*renderDpr);
  if(bloomPass.setSize) bloomPass.setSize(innerWidth,innerHeight);
}
function updateRenderQuality(dt){
  perf.t+=dt; perf.frames++;
  if(perf.t<1.2) return;
  const fps=perf.frames/perf.t;
  perf.cooldown=Math.max(0,perf.cooldown-perf.t);
  if(perf.cooldown<=0&&fps<47&&renderDpr>0.9){
    setRenderQuality(renderDpr-0.14); perf.cooldown=3.2;
  }else if(perf.cooldown<=0&&fps>58&&renderDpr<MAX_DPR-0.04){
    setRenderQuality(renderDpr+0.08); perf.cooldown=4.6;
  }
  perf.t=0; perf.frames=0;
}

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(),0.04).texture;

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  setRenderQuality(renderDpr);
});

const sun  = new THREE.DirectionalLight(0xffffff,2.2); scene.add(sun,sun.target);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near = 10; sun.shadow.camera.far = 500;
sun.shadow.camera.left = sun.shadow.camera.bottom = -130;
sun.shadow.camera.right = sun.shadow.camera.top = 130;
sun.shadow.bias = -0.0006;
const hemi = new THREE.HemisphereLight(0xbfd9ff,0x6b7a5a,1.0); scene.add(hemi);
const moonFill = new THREE.DirectionalLight(0xb8c8ff,0.0); scene.add(moonFill,moonFill.target);
const playerFill = new THREE.PointLight(0xdce9ff,0,48,1.45); scene.add(playerFill);

// sky elements: sun disc, moon, stars, clouds
function glowSprite(inner,outer,size){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(64,64,8,64,64,62);
  gr.addColorStop(0,inner); gr.addColorStop(1,outer);
  g.fillStyle=gr; g.fillRect(0,0,128,128);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({
    map:new THREE.CanvasTexture(c),transparent:true,fog:false,depthWrite:false}));
  s.scale.set(size,size,1); scene.add(s); return s;
}
const sunSpr  = glowSprite('rgba(255,244,200,1)','rgba(255,200,80,0)',130);
const moonSpr = glowSprite('rgba(220,230,255,0.9)','rgba(150,170,255,0)',60);
const stars = (()=>{
  const n=650, pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const a=rand(0,Math.PI*2), e=rand(0.06,1.4), r=900;
    pos[i*3]=Math.cos(a)*Math.cos(e)*r;
    pos[i*3+1]=Math.sin(e)*r;
    pos[i*3+2]=Math.sin(a)*Math.cos(e)*r;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const m=new THREE.PointsMaterial({color:0xcfd8ff,size:1.6,sizeAttenuation:false,
    transparent:true,opacity:0,fog:false,depthWrite:false});
  const p=new THREE.Points(g,m); scene.add(p); return p;
})();
const cloudMat=new THREE.SpriteMaterial({transparent:true,opacity:0.4,fog:false,depthWrite:false,
  map:(()=>{ const c=document.createElement('canvas'); c.width=256; c.height=128;
    const g=c.getContext('2d');
    for(let k=0;k<22;k++){
      const gr=g.createRadialGradient(rand(40,216),rand(40,88),4,rand(40,216),rand(40,88),rand(22,46));
      gr.addColorStop(0,'rgba(255,255,255,0.55)'); gr.addColorStop(1,'rgba(255,255,255,0)');
      g.fillStyle=gr; g.fillRect(0,0,256,128);
    }
    return new THREE.CanvasTexture(c); })()});
const clouds=[];
for(let k=0;k<10;k++){
  const s=new THREE.Sprite(cloudMat);
  s.position.set(rand(-650,650),rand(120,190),rand(-650,650));
  s.scale.set(rand(120,240),rand(40,80),1);
  scene.add(s); clouds.push(s);
}

// ---------------------------------------------------------------- city map texture
const MAPC = document.createElement('canvas'); MAPC.width=MAPC.height=4096;
const mc = MAPC.getContext('2d');
const W2C = 4096/WORLD;
const mx = x=>(x+WORLD/2)*W2C, mz = z=>(z+WORLD/2)*W2C;
function mrect(x0,z0,x1,z1,col){ mc.fillStyle=col; mc.fillRect(mx(x0),mz(z0),(x1-x0)*W2C,(z1-z0)*W2C); }

// grass base, beach + ocean on the east side
mrect(-WORLD/2,-WORLD/2,WORLD/2,WORLD/2,'#4a7c47');
mrect(448,-WORLD/2,WORLD/2,WORLD/2,'#d8c089');
mrect(515,-WORLD/2,WORLD/2,WORLD/2,'#2a6a9e');
mrect(508,-WORLD/2,515,WORLD/2,'#7fb8d8'); // surf line

// block types: downtown lots, parks, parking lots, one construction site, central plaza
const blockType=[];
for(let i=0;i<GRID;i++){
  blockType[i]=[];
  for(let j=0;j<GRID;j++){
    let t='lots';
    if(!(i>=4&&i<=5&&j>=4&&j<=5)){
      const r=Math.random();
      t = r<0.13?'park' : r<0.19?'parking' : 'lots';
    }
    blockType[i][j]=t;
  }
}
blockType[4][4]='plaza';
{ let ci,cj;
  do{ ci=irand(1,GRID-2); cj=irand(1,GRID-2); }while(blockType[ci][cj]!=='lots');
  blockType[ci][cj]='construction';
}

const INTERIOR={lots:'#787880',park:'#4f8f4c',parking:'#62626a',construction:'#8a6f4f',plaza:'#b3ada0'};
for(let i=0;i<GRID;i++)for(let j=0;j<GRID;j++){
  const x0=roadAt(i)+RH, z0=roadAt(j)+RH, x1=roadAt(i+1)-RH, z1=roadAt(j+1)-RH;
  mrect(x0,z0,x1,z1,'#9a9aa0');                       // sidewalk
  mrect(x0+6,z0+6,x1-6,z1-6,INTERIOR[blockType[i][j]]); // interior
  if(blockType[i][j]==='parking'){
    mc.fillStyle='#d8d8dc';
    for(const zz of [z0+16,(z0+z1)/2,z1-16])
      for(let x=x0+10;x<x1-10;x+=3.4) mc.fillRect(mx(x)-0.8,mz(zz-2.6),1.6,5.2*W2C);
  }
  if(blockType[i][j]==='plaza'){
    const cx=(x0+x1)/2, cz=(z0+z1)/2;
    mc.fillStyle='#c4beb0'; mc.beginPath(); mc.arc(mx(cx),mz(cz),20*W2C,0,7); mc.fill();
    mc.fillStyle='#3a7ca8'; mc.beginPath(); mc.arc(mx(cx),mz(cz),7*W2C,0,7); mc.fill();
  }
}
// roads
for(let i=0;i<=GRID;i++){
  mrect(roadAt(i)-RH,-CITY,roadAt(i)+RH,CITY,'#3a3a3e');
  mrect(-CITY,roadAt(i)-RH,CITY,roadAt(i)+RH,'#3a3a3e');
}
// dashed centre lines + crosswalks
mc.fillStyle='#d9b94c';
for(let i=0;i<=GRID;i++)for(let s=-CITY;s<CITY;s+=14){
  mc.fillRect(mx(roadAt(i))-1.5,mz(s),3,7*W2C);
  mc.fillRect(mx(s),mz(roadAt(i))-1.5,7*W2C,3);
}
mc.fillStyle='#cfcfd4';
for(let i=0;i<=GRID;i++)for(let j=0;j<=GRID;j++){
  const X=roadAt(i),Z=roadAt(j);
  for(let k=-6;k<=6;k+=2.4){
    mc.fillRect(mx(X+k)-1,mz(Z-RH-2),2,2*W2C);
    mc.fillRect(mx(X+k)-1,mz(Z+RH),2,2*W2C);
    mc.fillRect(mx(X-RH-2),mz(Z+k)-1,2*W2C,2);
    mc.fillRect(mx(X+RH),mz(Z+k)-1,2*W2C,2);
  }
}
// white road edge lines
mc.fillStyle='rgba(220,220,225,0.8)';
for(let i=0;i<=GRID;i++){
  for(const o of [-RH+0.5,RH-0.5]){
    mc.fillRect(mx(roadAt(i)+o)-1,mz(-CITY),2,2*CITY*W2C);
    mc.fillRect(mx(-CITY),mz(roadAt(i)+o)-1,2*CITY*W2C,2);
  }
}
// surface noise: asphalt/concrete grime + grass texture
for(let k=0;k<16000;k++){
  const x=rand(-WORLD/2,WORLD/2), z=rand(-WORLD/2,WORLD/2);
  mc.fillStyle=Math.random()<0.55?'rgba(0,0,0,0.07)':'rgba(255,255,255,0.05)';
  mc.fillRect(mx(x),mz(z),Math.random()<0.2?5:2,2);
}
// road scars, oil, lane reflectors, and shoreline foam baked into the ground texture
for(let k=0;k<260;k++){
  const vert=Math.random()<0.5;
  const line=roadAt(irand(0,GRID));
  const along=rand(-CITY+16,CITY-16);
  mc.save();
  mc.translate(mx(vert?line+rand(-5.2,5.2):along),mz(vert?along:line+rand(-5.2,5.2)));
  mc.rotate((vert?Math.PI/2:0)+rand(-0.18,0.18));
  mc.fillStyle=Math.random()<0.72?'rgba(0,0,0,0.17)':'rgba(255,255,255,0.08)';
  mc.fillRect(-rand(6,18),-rand(0.8,1.9),rand(12,38),rand(0.8,1.8));
  mc.restore();
}
mc.fillStyle='rgba(255,216,88,0.68)';
for(let i=0;i<=GRID;i++)for(let s=-CITY+8;s<CITY;s+=28){
  mc.fillRect(mx(roadAt(i))-2.2,mz(s)-1.1,4.4,2.2);
  mc.fillRect(mx(s)-1.1,mz(roadAt(i))-2.2,2.2,4.4);
}
for(let z=-WORLD/2;z<WORLD/2;z+=18){
  const y=mz(z+Math.sin(z*0.04)*2.2);
  mc.fillStyle='rgba(255,255,255,0.18)';
  mc.fillRect(mx(507+Math.sin(z*0.07)*1.7),y,9*W2C,1.4);
  mc.fillStyle='rgba(12,54,86,0.15)';

function cellOf(x,z){
  const i=Math.floor((x-R0)/P), j=Math.floor((z-R0)/P);
  return (i>=0&&i<GRID&&j>=0&&j<GRID)?cells[i][j]:null;

const PALETTE = ['#8d8d96','#a9a39b','#9c4a32','#6f7d8c','#c9c0b0','#7a6a5f','#5b7f9e','#b08f6a',
                 '#c77f5a','#86949e','#a08572','#d0c3a8'];
const bldgItems=[], glassItems=[], treeItems=[];
const antennaItems=[], propItems=[], wtItems=[], sfItems=[], pileItems=[];
const parkingBlocks=[];
const plazaCenter=new THREE.Vector3(), constructionAt=new THREE.Vector3();
const dummy = new THREE.Object3D();

for(let i=0;i<GRID;i++)for(let j=0;j<GRID;j++){
  const bx0=roadAt(i)+RH+6, bz0=roadAt(j)+RH+6, bx1=roadAt(i+1)-RH-6, bz1=roadAt(j+1)-RH-6;
  const bt=blockType[i][j];
  if(bt!=='lots'){
    if(bt==='park'){
      const n=irand(8,13);
      for(let t=0;t<n;t++){
        const x=rand(bx0+2,bx1-2), z=rand(bz0+2,bz1-2), s=rand(0.8,1.4);
        treeItems.push({x,z,s});
        cells[i][j].colliders.push({x0:x-0.5,z0:z-0.5,x1:x+0.5,z1:z+0.5});
      }
    }else if(bt==='plaza'){
      plazaCenter.set((bx0+bx1)/2,0,(bz0+bz1)/2);
      for(const [ox,oz] of [[1,1],[-1,1],[1,-1],[-1,-1]]){
        const x=plazaCenter.x+ox*21, z=plazaCenter.z+oz*21;
        treeItems.push({x,z,s:rand(1,1.3)});
        cells[i][j].colliders.push({x0:x-0.5,z0:z-0.5,x1:x+0.5,z1:z+0.5});
      }
      cells[i][j].colliders.push({x0:plazaCenter.x-6.5,z0:plazaCenter.z-6.5,
                                  x1:plazaCenter.x+6.5,z1:plazaCenter.z+6.5});
    }else if(bt==='construction'){
      constructionAt.set((bx0+bx1)/2,0,(bz0+bz1)/2);
      cells[i][j].colliders.push({x0:constructionAt.x-1.2,z0:constructionAt.z-1.2,
                                  x1:constructionAt.x+1.2,z1:constructionAt.z+1.2});
      for(let k=0;k<4;k++){
        const w=rand(2.5,5),d=rand(2.5,5),hh=rand(1,2.6);
        const x=rand(bx0+4,bx1-4), z=rand(bz0+4,bz1-4);
        pileItems.push({x,z,w,d,h:hh,c:pick(['#8a7a5f','#9a9a9e','#b0532f','#6e6e74'])});
        cells[i][j].colliders.push({x0:x-w/2,z0:z-d/2,x1:x+w/2,z1:z+d/2});
      }
    }else if(bt==='parking'){
      parkingBlocks.push({x0:bx0,z0:bz0,x1:bx1,z1:bz1});
    }
    continue;
  }
  const midx=(bx0+bx1)/2, midz=(bz0+bz1)/2;
  const lots=[[bx0,bz0,midx-1.5,midz-1.5],[midx+1.5,bz0,bx1,midz-1.5],
              [bx0,midz+1.5,midx-1.5,bz1],[midx+1.5,midz+1.5,bx1,bz1]];
  const centerDist=Math.hypot((roadAt(i)+P/2),(roadAt(j)+P/2))/620; // 0 centre .. ~1 edge
  lots.forEach((L,li)=>{
    if(Math.random()<0.08) return;          // empty lot
    const inX=rand(0,2), inZ=rand(0,2);
    const x0=L[0]+inX, z0=L[1]+inZ, x1=L[2]-inX, z1=L[3]-inZ;
    let h = (14+rand(0,18)) + (1-centerDist)*rand(10,60);
    if(Math.random()<0.06) h*=1.7;
    h=clamp(h,9,108);
    const cx=(x0+x1)/2, cz=(z0+z1)/2, w=x1-x0, d=z1-z0;
    const isGlass = h>34 && Math.random()<0.38;
    const tiered  = !isGlass && h>42 && Math.random()<0.5;
    const list = isGlass?glassItems:bldgItems;
    const col = isGlass
      ? new THREE.Color(pick(['#bcd6e8','#a8c8e0','#cfe2ee','#9fb8cc','#b8d8d0']))
      : new THREE.Color(pick(PALETTE));
    const pushBox=(bw,bh,bd)=>{
      dummy.position.set(cx,0,cz); dummy.scale.set(bw,bh,bd);
      dummy.rotation.set(0,0,0); dummy.updateMatrix();
      list.push({m:dummy.matrix.clone(),c:col});
    };
    if(tiered){ pushBox(w,h*0.5,d); pushBox(w-3.2,h*0.78,d-3.2); pushBox(w-6,h,d-6); }
    else pushBox(w,h,d);
    // rooftop detail
    if(h>50&&Math.random()<0.55)
      antennaItems.push({x:cx+rand(-2,2),z:cz+rand(-2,2),y:h,len:rand(5,12)});
    if(!tiered&&!isGlass&&h<46&&Math.random()<0.65)
      propItems.push({x:rand(x0+1.6,x1-1.6),z:rand(z0+1.6,z1-1.6),y:h,
                      w:rand(1,2.4),hh:rand(0.7,1.6),d2:rand(1,2.4)});
    if(!isGlass&&h>=18&&h<55&&Math.random()<0.2)
      wtItems.push({x:rand(x0+2,x1-2),z:rand(z0+2,z1-2),y:h});
    // colored storefront band at street level
    if(!isGlass&&Math.random()<0.55)
      sfItems.push({x:cx,z:cz,w:w+0.35,d:d+0.35,
        c:new THREE.Color(pick(['#c0392b','#2980b9','#27ae60','#8e44ad','#d35400','#16a085','#aa3366']))});
    // neon sign on a street-facing wall (plain towers only)
    if(!isGlass&&!tiered&&h>=18&&Math.random()<0.34){
      const item=list[list.length-1];
      const sy=Math.min(12,h*0.55), y=sy/2+rand(2,Math.max(2.5,h-sy-2));
      // outer sides per corner lot: 0:-X,-Z  1:+X,-Z  2:-X,+Z  3:+X,+Z
      const sideX=Math.random()<0.5;
      if(sideX) item.neon={x:(li===1||li===3)?x1+0.18:x0-0.18, y, z:rand(z0+1.5,z1-1.5), sx:0.3,sy,sz:1.1};
      else      item.neon={x:rand(x0+1.5,x1-1.5), y, z:(li>=2)?z1+0.18:z0-0.18, sx:1.1,sy,sz:0.3};
    }
    cells[i][j].colliders.push({x0,z0,x1,z1});
    mc.fillStyle='#55555e'; mc.fillRect(mx(x0),mz(z0),(x1-x0)*W2C,(z1-z0)*W2C);
  });
}

function updateAmbient(dt){
  oceanTex.offset.x=(oceanTex.offset.x+dt*0.015)%1;
  oceanTex.offset.y=(oceanTex.offset.y+dt*0.028)%1;
  // fountain spray particles loop up and fade
  for(const f of fountainSprays){
    f.t=(f.t+dt*0.55)%1;
    const r=f.t*2.6;
    f.s.position.set(plazaCenter.x+Math.cos(f.ang)*r,2.6+f.t*3.2-f.t*f.t*3.4,
                     plazaCenter.z+Math.sin(f.ang)*r);
    f.s.material.opacity=0.65*(1-f.t);
    f.s.scale.setScalar(0.4+f.t*1.1);
  }
  crane.rotation.y=Math.sin(gameT*0.06)*1.3;
  // ferris wheel
  ferris.ang+=dt*0.25;
  ferris.wheel.rotation.x=ferris.ang;
  ferris.gondolas.forEach((gd,k)=>{
    const a=ferris.ang+k/10*Math.PI*2;
    gd.position.set(0,ferris.cy+Math.sin(a)*ferris.R,Math.cos(a)*ferris.R);
  });
  // helicopter orbit
  heli.ang+=dt*0.06;
  const hx=Math.cos(heli.ang)*230, hz=Math.sin(heli.ang)*230;
  heli.group.position.set(hx,82+Math.sin(gameT*0.7)*3,hz);
  heli.group.rotation.y=-heli.ang;
  heli.group.rotation.z=0.08;
  heli.rotor.rotation.y+=dt*28;
  heli.tail.rotation.x+=dt*30;
  heliLight.position.copy(heli.group.position);
  heliLight.target.position.set(hx*0.82+Math.sin(gameT*0.5)*26,0,hz*0.82+Math.cos(gameT*0.43)*26);
  // boats
  for(const b of boats){
    b.t+=dt;
    b.g.position.z+=b.v*dt;
    if(Math.abs(b.g.position.z)>520) b.v*=-1;
    b.g.rotation.y=b.v>0?0:Math.PI;
    b.g.rotation.z=Math.sin(b.t*1.3)*0.045;
    b.g.position.y=Math.sin(b.t*1.7)*0.15;
  }
  // birds
  for(const f of flocks){
    f.t+=dt;
    f.g.position.x+=Math.sin(f.dir)*9*dt;
    f.g.position.z+=Math.cos(f.dir)*9*dt;
    f.g.rotation.y=f.dir;
    if(Math.abs(f.g.position.x)>600||Math.abs(f.g.position.z)>600){
      f.dir+=Math.PI+rand(-0.5,0.5);
      f.g.position.clampScalar(-600,600);
    }
    const flap=Math.sin(f.t*9)*0.55;
    f.wings.forEach((w,k)=>{ w.rotation.z=(k%2?-1:1)*flap; });
  }
}

// ---------------------------------------------------------------- collision
function collideAabb(p,r,b){
  if(p.x>b.x0&&p.x<b.x1&&p.z>b.z0&&p.z<b.z1){
    const dl=p.x-b.x0,dr=b.x1-p.x,dn=p.z-b.z0,df=b.z1-p.z,m=Math.min(dl,dr,dn,df);
    if(m===dl)p.x=b.x0-r; else if(m===dr)p.x=b.x1+r;
    else if(m===dn)p.z=b.z0-r; else p.z=b.z1+r;
    return true;
  }
  const nx=clamp(p.x,b.x0,b.x1), nz=clamp(p.z,b.z0,b.z1);
  const dx=p.x-nx, dz=p.z-nz, d2=dx*dx+dz*dz;
  if(d2<r*r&&d2>1e-9){
    const d=Math.sqrt(d2), push=(r-d)/d;
    p.x+=dx*push; p.z+=dz*push; return true;
  }
  return false;
}
function collideCircle(p,r){
  let hit=false;
  p.x=clamp(p.x,-BOUND,BOUND); p.z=clamp(p.z,-BOUND,BOUND);
  const cell=cellOf(p.x,p.z);
  if(cell) for(const b of cell.colliders) if(collideAabb(p,r,b)) hit=true;
  for(const b of looseColliders) if(collideAabb(p,r,b)) hit=true;
  return hit;
}

// ---------------------------------------------------------------- audio
let AC=null, engGain, engOsc, engFilter, sirenGain, sirenOsc;
function initAudio(){
  if(AC) return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    engOsc=AC.createOscillator(); engOsc.type='sawtooth'; engOsc.frequency.value=70;
    engFilter=AC.createBiquadFilter(); engFilter.type='lowpass'; engFilter.frequency.value=320;
    engGain=AC.createGain(); engGain.gain.value=0;
    engOsc.connect(engFilter).connect(engGain).connect(AC.destination); engOsc.start();
    sirenOsc=AC.createOscillator(); sirenOsc.type='triangle'; sirenOsc.frequency.value=700;
    sirenGain=AC.createGain(); sirenGain.gain.value=0;
    sirenOsc.connect(sirenGain).connect(AC.destination); sirenOsc.start();
  }catch(e){ AC=null; }
}
function burst(dur,freq,vol,type='bandpass'){
  if(!AC) return;
  const n=AC.sampleRate*dur, buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const src=AC.createBufferSource(); src.buffer=buf;
  const f=AC.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=0.8;
  const g=AC.createGain(); g.gain.value=vol;
  src.connect(f).connect(g).connect(AC.destination); src.start();
}
function blip(f0,f1,vol){
  if(!AC) return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.frequency.setValueAtTime(f0,AC.currentTime);
  o.frequency.linearRampToValueAtTime(f1,AC.currentTime+0.12);
  g.gain.setValueAtTime(vol,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.15);
  o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime+0.16);
}
function hornSfx(){
  if(!AC) return;
  for(const f of [400,505]){
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='square'; o.frequency.value=f; g.gain.value=0.06;
    g.gain.setValueAtTime(0.06,AC.currentTime);
    g.gain.linearRampToValueAtTime(0,AC.currentTime+0.45);

const roundedGeoCache=new Map();
function roundedBoxGeo(w,h,d,r=0.08,seg=5){
  const rr=Math.min(r,w*0.46,h*0.46,d*0.46);
  const key=[w,h,d,rr,seg].map(v=>Number(v).toFixed(3)).join(':');
  if(!roundedGeoCache.has(key)) roundedGeoCache.set(key,new RoundedBoxGeometry(w,h,d,seg,rr));
  return roundedGeoCache.get(key);
}
const nightReadableMats=[];
function readableGlowColor(color){
  const c=new THREE.Color(color);
  if(c.r+c.g+c.b<0.7) c.lerp(new THREE.Color(0x9bbcff),0.72);
  else c.lerp(new THREE.Color(0xffffff),0.25);
  return c;
}
function registerNightReadableMaterial(mat,color,intensity=0.08){
  if(!mat.emissive) return mat;
  nightReadableMats.push({
    mat,
    dayEmissive:mat.emissive.clone(),
    dayIntensity:mat.emissiveIntensity||0,
    glow:readableGlowColor(color),
    intensity
  });
  return mat;
}
function updateNightReadableMaterials(nightAmount){
  for(const it of nightReadableMats){
    it.mat.emissive.copy(it.dayEmissive).lerp(it.glow,nightAmount);
    it.mat.emissiveIntensity=it.dayIntensity+nightAmount*it.intensity;
  }
}

const cars=[];
function randomRoadSpawn(){
  const dir=irand(0,3);                       // 0:+X 1:+Z 2:-X 3:-Z
  const DIRS=[[1,0],[0,1],[-1,0],[0,-1]];
  const [dx,dz]=DIRS[dir];
  const j=irand(0,GRID);
  const along=rand(-CITY+30,CITY-30);
  let x,z;
  if(dx!==0){ z=roadAt(j); x=along; } else { x=roadAt(j); z=along; }
  // right-of-travel lane offset
  x+=-dz*4; z+=dx*4;
  return {x,z,dir,j};
}
const DIRS=[[1,0],[0,1],[-1,0],[0,-1]];
function nodeAhead(x,z,dir){
  const [dx,dz]=DIRS[dir];
  if(dx!==0){
    const i=clamp(dx>0?Math.ceil((x-R0)/P):Math.floor((x-R0)/P),0,GRID);
    return {i,j:Math.round((z-(-dz*4)-R0)/P)};
  }
  const j=clamp(dz>0?Math.ceil((z-R0)/P):Math.floor((z-R0)/P),0,GRID);
  return {i:Math.round((x-(-dz*4)-R0)/P),j};
}
function laneWaypoint(node,dir){
  const [dx,dz]=DIRS[dir];
  return new THREE.Vector3(roadAt(node.i)+(-dz)*4,0,roadAt(node.j)+dx*4);
}
function chooseNext(c){
  const opts=[];
  for(let d=0;d<4;d++){
    if((d+2)%4===c.dir) continue;
    const ni=c.node.i+DIRS[d][0], nj=c.node.j+DIRS[d][1];
    if(ni<0||ni>GRID||nj<0||nj>GRID) continue;
    opts.push({d,w:d===c.dir?2:1});
  }
  if(!opts.length){ c.dir=(c.dir+2)%4; }
  else{
    let tot=0; for(const o of opts) tot+=o.w;
    let r=Math.random()*tot;
    for(const o of opts){ r-=o.w; if(r<=0){ c.dir=o.d; break; } }
  }
  c.node={i:c.node.i+DIRS[c.dir][0], j:c.node.j+DIRS[c.dir][1]};
  c.way=laneWaypoint(c.node,c.dir);
}

function trafficType(){
  const r=Math.random();
  return r<0.3?'sedan':r<0.5?'taxi':r<0.62?'sports':r<0.77?'pickup':r<0.92?'van':'bus';
}
function spawnTraffic(){
  const s=randomRoadSpawn();
  const c=makeCar(trafficType(),pick(CAR_COLORS));
  c.type='traffic';
  c.p.set(s.x,0,s.z);
  c.dir=s.dir;
  c.th=Math.atan2(DIRS[s.dir][0],DIRS[s.dir][1]);
  const nb=nodeAhead(s.x,s.z,s.dir);
  // recover j index properly for axis roads
  if(DIRS[s.dir][0]!==0) nb.j=s.j; else nb.i=s.j;
  c.node=nb; c.way=laneWaypoint(c.node,c.dir);
  c.speed=12;
  cars.push(c);
  return c;
}
for(let k=0;k<18;k++) spawnTraffic();

// parked cars near curbs
for(let k=0;k<10;k++){
  const c=makeCar(pick(['sedan','taxi','pickup','van','sports']),pick(CAR_COLORS));

function rayHitDistance(origin,dir,target,radius,minDist,maxDist){
  const dx=target.x-origin.x, dz=target.z-origin.z;
  const along=dx*dir.x+dz*dir.z;
  if(along<minDist||along>maxDist) return Infinity;
  const side2=dx*dx+dz*dz-along*along;
  if(side2>radius*radius) return Infinity;
  return along;
}
function damageCar(c,n,extraCrime=0){
  if(!c||c.type==='wreck'||c.health<=0) return;
  c.health-=n;
  c.smokeT=0;
  if(extraCrime>0) addCrime(c.type==='police'?extraCrime+0.9:extraCrime);
  if(c===player.car) updateCarBar();

}
function fireBulletWeapon(w){
  player.lastShot=gameT;
  burst(0.13,w.soundFreq,w.soundVol);
  addCrime(w.crime);
  const origin=player.p.clone().setY(1.35);
  flashAt(origin.clone().addScaledVector(fwdOf(player.th),0.85),w.color);
  for(let k=0;k<w.rays;k++){
    const dir=fwdOf(player.th+(w.spread?rand(-w.spread,w.spread):0));
    let hit=null, kind=null, best=w.range;
    for(const pd of peds){
      if(pd.dead) continue;
      const d=rayHitDistance(origin,dir,pd.p,0.55,1,w.range);
      if(d<best){ best=d; hit=pd; kind='ped'; }
    }
    for(const c of cars){
      if(c.type==='wreck'||c===player.car) continue;
      const T=CAR_TYPES[c.model]||CAR_TYPES.sedan;
      const r=Math.max(T.W,T.L)*0.45;
      const d=rayHitDistance(origin,dir,c.p,r,1.4,w.range);
      if(d<best){ best=d; hit=c; kind='car'; }
    }
    const end=origin.clone().addScaledVector(dir,best); end.y=1.15;
    tracer(origin,end);
    if(kind==='ped') killPed(hit,true);
    else if(kind==='car'){
      damageCar(hit,w.carDamage,hit.type==='police'?0.25:0);
      sparkBurst(end,3);
    }
  }
  fleeAround(player.p,w.flee);
}

function policeSpawnPoint(){
  const pp=playerPos();
  let fallback=null, fallbackScore=Infinity;
  for(let k=0;k<36;k++){
    const ang=rand(0,Math.PI*2), d0=rand(POLICE_SPAWN_MIN,POLICE_SPAWN_MAX);
    const rawX=clamp(pp.x+Math.cos(ang)*d0,-CITY+24,CITY-24);
    const rawZ=clamp(pp.z+Math.sin(ang)*d0,-CITY+24,CITY-24);
    const vertical=Math.random()<0.5;
    let x=rawX, z=rawZ, dir, j;
    if(vertical){
      j=clamp(Math.round((rawX-R0)/P),0,GRID);
      dir=rawZ<pp.z?1:3;
      x=roadAt(j);
    }else{
      j=clamp(Math.round((rawZ-R0)/P),0,GRID);
      dir=rawX<pp.x?0:2;
      z=roadAt(j);
    }
    const [dx,dz]=DIRS[dir];
    x=clamp(x-dz*4,-CITY+18,CITY-18);
    z=clamp(z+dx*4,-CITY+18,CITY-18);
    const d=Math.hypot(x-pp.x,z-pp.z);
    const score=Math.abs(d-POLICE_SPAWN_TARGET);
    const s={x,z,dir,j};
    if(d>=POLICE_SPAWN_MIN&&d<=POLICE_SPAWN_MAX) return s;
    if(d>30&&score<fallbackScore){ fallback=s; fallbackScore=score; }
  }
  return fallback||randomRoadSpawn();
}

  c.th=angLerp(c.th,Math.atan2(dx,dz),3.8*dt);
  const f=fwdOf(c.th);
  const ax=c.p.x+f.x*9, az=c.p.z+f.z*9;
  let blocked=false;
  for(const o of cars){
    if(o===c||o.type==='wreck') continue;
    if((o.p.x-ax)**2+(o.p.z-az)**2<24){ blocked=true; break; }
  }
  const want=blocked?4:(dist<12?cruise*0.55:cruise);
  c.speed+=clamp(want-c.speed,-34*dt,12*dt);
  c.p.addScaledVector(f,c.speed*dt);
  collideCircle(c.p,2.1);
  if(dist<2.8) chooseNext(c);
  syncCar(c,dt);
}
function nearestCopDistance(){
  let best=999;
  const pp=playerPos();
  for(const c of cars) if(c.type==='police') best=Math.min(best,distXZ(c.p,pp));
  return best;
}
function updateRideQuality(dt){
  if(!player.driving||player.car!==mission.jobCar){
    mission.tip=clamp(mission.tip-dt*10,40,140);
    return;
  }
  const c=player.car, lost=Math.max(0,mission.lastCarHealth-c.health);
  mission.lastCarHealth=c.health;
  mission.tip-=lost*2.6;
  const sp=Math.abs(c.speed);
  if(sp>20&&sp<31&&wanted<1) mission.tip+=dt*4.2;
  if(sp>31) mission.tip-=dt*4.5;
  if(wanted>=1) mission.tip-=dt*9;
  mission.tip=clamp(mission.tip,40,140);
}
function updateCargoCondition(dt){
  if(!player.driving||player.car!==mission.jobCar){
    mission.cargoHealth-=dt*9;
    return;
  }
  const c=player.car, lost=Math.max(0,mission.lastCarHealth-c.health);
  mission.lastCarHealth=c.health;
  mission.cargoHealth-=lost*2.4;
  if(Math.abs(c.speed)>31) mission.cargoHealth-=dt*2.2;
  mission.cargoHealth=clamp(mission.cargoHealth,0,100);
}

        `${missionTitle('MINI HEIST')} - escape to hideout - ${missionTime()}s - $${mission.reward}`;
      if(distXZ(pp,mission.dest)<7){ completeMission('HEIST COMPLETE',{clearHeat:true}); return; }
    }
    if(mission.timeLeft<=0){ failMission('Heist failed.'); return; }
  }else if(mission.kind==='getaway'){
    mission.timeLeft-=dt;
    if(mission.phase==='run'){
      raiseWantedTo(2.2);
      ui.missionText.textContent=`${missionTitle('GETAWAY')} - survive the heat - ${missionTime()}s - $${mission.reward}`;
      if(mission.timeLeft<=0){
        mission.phase='safehouse';
        mission.timeLeft=46;
        setMissionDest(mission.dropoff,0x8f6aff,'#b28cff');
        blip(620,900,0.16);
        toast('Reach the safehouse');
        story('Dispatch loses your route for a few precious seconds. A safehouse light just came on across town.',6.3);
      }
    }else{
      raiseWantedTo(1.2);
      ui.missionText.textContent=`${missionTitle('GETAWAY')} - reach the violet marker - ${missionTime()}s - $${mission.reward}`;
      if(distXZ(pp,mission.dest)<7){ completeMission('GETAWAY COMPLETE',{clearHeat:true}); return; }
      if(mission.timeLeft<=0){ failMission('Getaway failed. You missed the safehouse.'); return; }
    }
  }
}

}

const grenadeGeo=new THREE.SphereGeometry(0.28,8,6);

const flashTex=(()=>{
  const c=document.createElement('canvas'); c.width=c.height=96;

  gr.addColorStop(1,'rgba(255,120,20,0)');
  g.fillStyle=gr; g.fillRect(0,0,96,96);

function sparkBurst(pos,n=8){

function dustPuff(pos,n=2){

function explode(c){

  const ball=new THREE.Mesh(new THREE.SphereGeometry(1,12,10),

function tracer(a,b,color=0xffe27a){

  const l=new THREE.Line(g,new THREE.LineBasicMaterial({color,transparent:true,opacity:1}));

}
function grenadeBlast(pos,w){
  burst(0.5,w.soundFreq,w.soundVol,'lowpass'); burst(0.25,950,0.28);
  addCrime(w.crime);
  const ball=new THREE.Mesh(new THREE.SphereGeometry(1,14,10),
    new THREE.MeshBasicMaterial({color:0xffc83a,transparent:true,opacity:0.95}));
  ball.position.copy(pos).setY(1.15); scene.add(ball);
  fx.push({m:ball,t:0,kind:'ball'});
  for(let k=0;k<10;k++){
    const s=new THREE.Sprite(smokeMat.clone());
    s.position.set(pos.x+rand(-1.8,1.8),rand(0.8,2.8),pos.z+rand(-1.8,1.8));
    s.scale.setScalar(rand(2.2,4.6)); scene.add(s);
    fx.push({m:s,t:0,kind:'smoke',vy:rand(1.6,3.8)});
  }
  for(const c of cars){
    if(c.type==='wreck') continue;
    const d=Math.hypot(c.p.x-pos.x,c.p.z-pos.z);
    if(d>w.radius) continue;
    damageCar(c,w.carDamage*(1-d/w.radius));
    c.speed*=0.35;
  }
  for(const pd of peds){
    if(!pd.dead&&Math.hypot(pd.p.x-pos.x,pd.p.z-pos.z)<w.radius*0.82) killPed(pd,!!pd.police);
  }
  const pp=playerPos(), d=Math.hypot(pp.x-pos.x,pp.z-pos.z);
  if(d<w.radius){
    if(player.driving&&player.car) updateCarBar();
    else hurtPlayer(Math.round(w.playerDamage*(1-d/w.radius)));
  }
  fleeAround(pos,w.flee);
}

const keys={};
let started=false, pointerFire=false;
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  keys[e.code]=true;
  if(e.code==='KeyE') tryEnterExit();
  if(e.code==='KeyF') shoot();
  if(e.code==='KeyH') horn();
  if(e.code.startsWith('Digit')) selectWeaponSlot(Number(e.code.slice(5)));
});
addEventListener('keyup',e=>{ keys[e.code]=false; });
addEventListener('pointerup',()=>{ pointerFire=false; });
addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; pointerFire=false; });
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ for(const k in keys) keys[k]=false; pointerFire=false; }
});
renderer.domElement.addEventListener('pointerdown',()=>{ if(started){ pointerFire=true; shoot(); } });

const K={
  fwd:()=>keys.KeyW||keys.ArrowUp, back:()=>keys.KeyS||keys.ArrowDown,
  left:()=>keys.KeyA||keys.ArrowLeft, right:()=>keys.KeyD||keys.ArrowRight,
  hb:()=>keys.Space
};

function horn(){
  if(!player.driving||state!=='play') return;
  hornSfx(); fleeAround(player.car.p,16);
}
function shoot(){
  if(player.driving||state!=='play') return;
  const w=WEAPONS[player.weapon]||WEAPONS.pistol;
  if(w.throwable){ throwGrenade(w); return; }
  if(gameT-player.lastShot<w.cooldown) return;
  fireBulletWeapon(w);
}
function tryEnterExit(){
  if(state!=='play') return;
  if(player.driving){
    const c=player.car, f=fwdOf(c.th);
    const left=new THREE.Vector3(f.z,0,-f.x);
    player.p.copy(c.p).addScaledVector(left,2.6);
    collideCircle(player.p,0.5);
    player.p.y=0;
    player.mesh.g.visible=true;
    player.th=c.th;
    c.type=c.health>0?'parked':'wreck'; c.speed*=0.2;
    player.driving=false; player.car=null;
    ui.carwrap.style.display='none'; ui.speedo.style.display='none';
    return;
  }
  let best=null,bd=4.5;
  for(const c of cars){
    if(c.type==='wreck') continue;
    const d=Math.hypot(c.p.x-player.p.x,c.p.z-player.p.z);
    if(d<bd){ bd=d; best=c; }
  }
  if(!best) return;
  if(best.type==='traffic'||best.type==='police'){
    addCrime(best.type==='police'?2:0.6);
    toast(best.type==='police'?'You jacked a cop car?!':'Grand theft auto!');
  }
  best.type='player';
  player.driving=true; player.car=best;
  player.mesh.g.visible=false;
  ui.carwrap.style.display='block'; ui.speedo.style.display='block';
  updateCarBar();
}

// ---------------------------------------------------------------- updates
function updatePlayer(dt){
  if(player.hurtCD>0) player.hurtCD-=dt;
  if(player.driving){ updateDriving(dt); return; }
  // tank-style: A/D turn, W/S walk — only A/D can change heading
  const turn=(K.left()?1:0)-(K.right()?1:0), iz=(K.fwd()?1:0)-(K.back()?1:0);
  player.th+=turn*3.2*dt;
  if(iz){
    const mv=fwdOf(player.th).multiplyScalar(iz>0?8.5:-5);
    player.p.addScaledVector(mv,dt);
    collideCircle(player.p,0.45);
    player.walk=(player.walk||0)+dt*(iz>0?9:6);
    for(let k=0;k<2;k++){
      player.mesh.limbs.legs[k].rotation.x=Math.sin(player.walk+k*Math.PI)*0.7;
      player.mesh.limbs.arms[k].rotation.x=Math.sin(player.walk+(1-k)*Math.PI)*0.5;
    }
  }else{
    for(let k=0;k<2;k++){
      player.mesh.limbs.legs[k].rotation.x*=0.8;
      player.mesh.limbs.arms[k].rotation.x*=0.8;
    }
  }
  player.mesh.g.rotation.y=player.th;
  const weapon=WEAPONS[player.weapon]||WEAPONS.pistol;
  if(weapon.auto&&(pointerFire||keys.KeyF)) shoot();
  // nearest enterable car hint
  let near=false;
  for(const c of cars){
    if(c.type==='wreck') continue;
    if(Math.hypot(c.p.x-player.p.x,c.p.z-player.p.z)<4.5){ near=true; break; }
  }
  ui.hint.textContent=near?'Press E to enter the vehicle':'';
}

function updateDriving(dt){
  const c=player.car;
  const fwd=K.fwd(), back=K.back(), hb=K.hb();
  let acc=0;
  if(fwd) acc=c.speed<0?22:c.stats.acc;
  if(back) acc=c.speed>1?-26:-9;
  c.speed+=acc*dt;
  c.speed*=Math.exp(-(fwd||back?0.22:0.9)*dt);
  if(hb) c.speed*=Math.exp(-1.8*dt);
  c.speed=clamp(c.speed,-11,c.stats.max);
  const steer=(K.left()?1:0)-(K.right()?1:0);
  const sf=clamp(Math.abs(c.speed)/9,0,1)/(1+Math.abs(c.speed)*0.022);
  c.th+=steer*(hb?c.stats.steer+0.95:c.stats.steer)*sf*dt*Math.sign(c.speed||1);
  c.roll+=(-steer*sf*0.11*Math.sign(c.speed||1)-c.roll)*Math.min(1,7*dt);
  c.pitch+=(((fwd?0.035:0)+(back?-0.045:0)+(hb?-0.035:0))-c.pitch)*Math.min(1,6*dt);
  const f=fwdOf(c.th);
  const before=c.p.clone();
  c.p.addScaledVector(f,c.speed*dt);
  const sp=Math.abs(c.speed);
  if(c.dmgCD>0) c.dmgCD-=dt;
  if(c.dustT>0) c.dustT-=dt;
  if(collideCircle(c.p,2.2)){
    // head-on if forward progress was mostly blocked; scrapes just slow you down
    const progress=(c.p.x-before.x)*f.x+(c.p.z-before.z)*f.z;
    if(Math.abs(progress)<Math.abs(c.speed*dt)*0.5&&sp>11){
      if(c.dmgCD<=0){
        c.dmgCD=0.5;
        c.health-=sp*0.8; updateCarBar();
        burst(0.25,300,clamp(sp/40,0.1,0.5),'lowpass');
        sparkBurst(c.p.clone().addScaledVector(f,1.8).setY(0.72),10);
        camKick=Math.min(0.12,camKick+sp*0.0032);
      }
      c.speed*=-0.25;
    }else{
      c.speed*=Math.exp(-3.5*dt);
    }
  }
  // car-vs-car
  if(c.bumpCD>0) c.bumpCD-=dt;
  for(const o of cars){
    if(o===c) continue;
    const dx=o.p.x-c.p.x, dz=o.p.z-c.p.z, d=Math.hypot(dx,dz);
    if(d<4.1&&d>0.01){
      const push=(4.1-d)/d;
      o.p.x+=dx*push*0.5; o.p.z+=dz*push*0.5;
      c.p.x-=dx*push*0.5; c.p.z-=dz*push*0.5;
      if(sp>11&&c.bumpCD<=0){
        c.bumpCD=0.6;
        c.health-=sp*0.28; updateCarBar();
        if(o.type!=='wreck') o.health-=sp*0.5;
        o.speed*=0.4;
        burst(0.22,400,clamp(sp/50,0.08,0.4),'lowpass');
        sparkBurst(c.p.clone().lerp(o.p,0.5).setY(0.82),9);
        camKick=Math.min(0.1,camKick+sp*0.0024);
        if(o.type==='police') addCrime(1);
        if(o.health<=0&&o.type!=='wreck') explode(o);
      }
      c.speed*=0.86;
    }
  }
  if((hb||Math.abs(steer)>0.5)&&sp*KMH_PER_SPEED>=TIRE_SMOKE_MIN_KMH&&c.dustT<=0){
    c.dustT=0.055;
    const side=new THREE.Vector3(-f.z,0,f.x);
    for(const s of [-1,1]) dustPuff(c.p.clone().addScaledVector(f,-1.3).addScaledVector(side,s*0.78),2);
  }
  if(c.health<=0){ explode(c); die('WASTED','#d22'); return; }
  // damaged engine smokes as a warning before it blows
  if(c.health<45){
    if(!c.warned){ c.warned=true; toast('Your ride is smoking — find a new one!'); }
    c.smokeT-=dt;
    if(c.smokeT<=0){
      c.smokeT=c.health<20?0.1:0.3;
      const s=new THREE.Sprite(smokeMat.clone());
      if(c.health<20) s.material.color.set(0x222222);
      s.position.copy(c.p).addScaledVector(f,1.8).setY(1.1);
      s.scale.setScalar(rand(0.8,1.6));
      scene.add(s);
      fx.push({m:s,t:0,kind:'smoke',vy:rand(1.5,2.5)});
    }
  }
  // run over peds
  if(sp>7){
    for(const pd of peds){
      if(pd.dead) continue;
      if(Math.hypot(pd.p.x-c.p.x,pd.p.z-c.p.z)<2.3) killPed(pd,true);
    }
  }
  syncCar(c,dt);
  for(const w of c.fw) w.rotation.y=steer*0.42;
  c.tlMat.emissiveIntensity=(back||hb)?2.4:0.4;
  ui.speedo.firstChild.textContent=Math.round(sp*KMH_PER_SPEED)+' ';
  // hit player? n/a. proximity flee
  if(sp>14) fleeAround(c.p,7);
}

function updateTraffic(c,dt){
  const dx=c.way.x-c.p.x, dz=c.way.z-c.p.z, dist=Math.hypot(dx,dz);
  c.th=angLerp(c.th,Math.atan2(dx,dz),4*dt);
  const f=fwdOf(c.th);
  const probe=c.stats.cruise<13?12:8.5; // buses are long, look further ahead
  const ax=c.p.x+f.x*probe, az=c.p.z+f.z*probe;
  let blocked=false;
  for(const o of cars){
    if(o===c) continue;
    if((o.p.x-ax)**2+(o.p.z-az)**2<30){ blocked=true; break; }
  }
  if(!blocked&&!player.driving&&(player.p.x-ax)**2+(player.p.z-az)**2<18) blocked=true;
  const want=blocked?0:(dist<13?9:c.stats.cruise);
  c.speed+=clamp(want-c.speed,-32*dt,9*dt);
  c.p.addScaledVector(f,c.speed*dt);
  collideCircle(c.p,2.0);
  if(dist<2.6) chooseNext(c);
  syncCar(c,dt);
}

function updatePolice(c,dt){
  const pp=playerPos();
  const dx=pp.x-c.p.x, dz=pp.z-c.p.z, dist=Math.hypot(dx,dz);
  if(!c.deployed){
    if(dist>4) c.th=angLerp(c.th,Math.atan2(dx,dz),3.4*dt);
    const f=fwdOf(c.th);
    const stopAt=c.deployRange||(player.driving?28:22);
    let want=0;
    if(dist>stopAt+12) want=22;
    else if(dist>stopAt+4) want=12;
    else if(dist<stopAt-3) want=-4;
    if(c.revT>0){ c.revT-=dt; want=-7; }
    c.speed+=clamp(want-c.speed,-36*dt,13*dt);
    const before=c.p.clone();
    c.p.addScaledVector(f,c.speed*dt);
    collideCircle(c.p,2.2);
    const moved=before.distanceTo(c.p);
    if(Math.abs(c.speed)>5&&moved<Math.abs(c.speed)*dt*0.3){
      c.stuckT+=dt;
      if(c.stuckT>1.1){ c.revT=0.8; c.stuckT=0; }
    }else c.stuckT=Math.max(0,c.stuckT-dt);
    if((dist<stopAt+6&&Math.abs(c.speed)<7)||dist<18) deployOfficer(c);
  }else{
    c.speed*=Math.exp(-5*dt);
  }
  // flashing lightbar
  if(c.barMats){
    const on=Math.floor(gameT*5)%2;
    c.barMats[0].emissiveIntensity=on?2.5:0.1;
    c.barMats[1].emissiveIntensity=on?0.1:2.5;
  }
  syncCar(c,dt);
}

function officerShoot(pd,dist){
  pd.shootT=rand(0.62,1.05);
  const origin=pd.p.clone().setY(1.42);
  const target=(player.driving?player.car.p:player.p).clone().setY(player.driving?0.95:1.36);
  const spread=0.18+dist*0.016+(player.driving?0.35:0);
  const end=target.clone().add(new THREE.Vector3(rand(-spread,spread),rand(-0.08,0.12),rand(-spread,spread)));
  flashAt(origin.clone().addScaledVector(fwdOf(pd.th),0.62),0xa9dcff);
  tracer(origin,end,0x9bd7ff);
  burst(0.08,1250,0.14);
  const hitChance=clamp(0.72-dist*0.012-(player.driving?0.16:0),0.24,0.68);
  if(Math.random()>hitChance) return;
  if(player.driving&&player.car&&player.car.health>0){
    const pc=player.car;
    pc.health-=3.8;
    updateCarBar();
    sparkBurst(target.clone().setY(0.95),2);
    if(pc.health<=0){ explode(pc); die('WASTED','#d22'); }
  }else if(player.hurtCD<=0){
    player.hurtCD=0.16;
    hurtPlayer(7);
    camKick=Math.min(0.08,camKick+0.025);
  }
}

function updateOfficer(pd,dt){
  if(pd.shootT>0) pd.shootT-=dt;
  if(state!=='play') return;
  const pp=playerPos();
  const dx=pp.x-pd.p.x, dz=pp.z-pd.p.z, dist=Math.hypot(dx,dz)||1;
  pd.th=angLerp(pd.th,Math.atan2(dx,dz),8*dt);
  const desired=player.driving?24:17;
  let move=0;
  if(dist>desired+3) move=4.8;
  else if(!player.driving&&dist<7) move=-2.6;
  if(move){
    pd.p.addScaledVector(fwdOf(pd.th),move*dt);
    collideCircle(pd.p,0.42);
  }
  if(dist<38&&pd.shootT<=0) officerShoot(pd,dist);
  pd.person.g.rotation.y=pd.th;
  const walk=Math.abs(move);
  pd.walkT+=dt*(walk>0?walk*3.4:2.5);
  for(let k=0;k<2;k++){
    pd.person.limbs.legs[k].rotation.x=walk>0.1?Math.sin(pd.walkT+k*Math.PI)*0.58:pd.person.limbs.legs[k].rotation.x*0.72;
  }
  pd.person.limbs.arms[0].rotation.x=-0.75+Math.sin(pd.walkT)*0.04;
  pd.person.limbs.arms[1].rotation.x=-1.18+Math.sin(pd.walkT+1.2)*0.04;
}

function updatePeds(dt){
  for(let i=peds.length-1;i>=0;i--){
    const pd=peds[i];
    if(pd.dead){
      pd.deadT+=dt;
      if(pd.deadT>12){
        if(pd.police){ removePolicePed(pd); continue; }
        pd.dead=false;
        pd.person.g.rotation.z=0;
        pd.person.g.position.y=0;
        const i=irand(0,GRID-1), j=irand(0,GRID-1);
        pd.ring=pedRing(i,j); pd.corner=irand(0,3);
        const cnr=pd.ring[pd.corner];
        pd.p.set(cnr.x,0,cnr.z); pd.flee=null;
      }
      continue;
    }
    if(pd.police){ updateOfficer(pd,dt); continue; }
    let speed=1.7, tx, tz;
    if(pd.flee){
      pd.flee.t-=dt;
      if(pd.flee.t<=0) pd.flee=null;
      else{
        const dx=pd.p.x-pd.flee.x, dz=pd.p.z-pd.flee.z, d=Math.hypot(dx,dz)||1;
        tx=pd.p.x+dx/d*10; tz=pd.p.z+dz/d*10; speed=6;
      }
    }
    if(!pd.flee){
      const c=pd.ring[pd.corner];
      tx=c.x; tz=c.z;
      if(Math.hypot(tx-pd.p.x,tz-pd.p.z)<1.2)
        pd.corner=(pd.corner+(pd.cw?1:3))%4;
    }
    const dx=tx-pd.p.x, dz=tz-pd.p.z, d=Math.hypot(dx,dz)||1;
    pd.th=angLerp(pd.th,Math.atan2(dx,dz),8*dt);
    pd.p.x+=dx/d*speed*dt; pd.p.z+=dz/d*speed*dt;
    collideCircle(pd.p,0.4);
    pd.person.g.rotation.y=pd.th;
    pd.walkT+=dt*speed*3.2;
    for(let k=0;k<2;k++){
      pd.person.limbs.legs[k].rotation.x=Math.sin(pd.walkT+k*Math.PI)*0.65;
      pd.person.limbs.arms[k].rotation.x=Math.sin(pd.walkT+(1-k)*Math.PI)*0.5;
    }
  }
}

function updateWantedAndCops(dt){
  if(wanted>0&&gameT-lastCrime>10){
    wanted=Math.max(0,wanted-1); lastCrime=gameT-4; updateStars();
    if(wanted===0) toast('You lost the heat');
  }
  const target=copsWanted();
  let count=0;
  for(const c of cars) if(c.type==='police') count++;
  if(count<target) spawnCop();
  if(count>target){
    for(let k=cars.length-1;k>=0&&count>target;k--){
      if(cars[k].type==='police'){
        const d=Math.hypot(cars[k].p.x-playerPos().x,cars[k].p.z-playerPos().z);
        if(target===0||d>70){ removePoliceCarAt(k); count--; }
      }
    }
  }
  // busted check
  let copNear=false;
  const pp=playerPos();
  const mySpeed=player.driving?Math.abs(player.car.speed):0;
  if(mySpeed<3){
    for(const pd of peds){
      if(!pd.police||pd.dead) continue;
      if(Math.hypot(pd.p.x-pp.x,pd.p.z-pp.z)<3.2){ copNear=true; break; }
    }
  }
  if(copNear&&wanted>=1){
    bustT+=dt;
    if(bustT>2.4&&state==='play') die('BUSTED','#5db8ff');
  } else bustT=Math.max(0,bustT-dt*2);
  if(sirenGain) sirenGain.gain.value = target>0?0.022:0;
  if(sirenOsc&&target>0) sirenOsc.frequency.value=Math.floor(gameT*2.2)%2?940:660;
}

function updatePickupsAndMission(dt){
  const pp=playerPos();
  for(const pk of pickups){
    pk.t+=dt;
    if(!pk.active){
      if(pk.t>25){
        pk.active=true; pk.spr.visible=true;
        const p=randomSidewalkPoint(); pk.spr.position.set(p.x,1.1,p.z);
      }
      continue;
    }
    pk.spr.position.y=1.1+Math.sin(pk.t*3)*0.18;
    if(Math.hypot(pk.spr.position.x-pp.x,pk.spr.position.z-pp.z)<2.6){
      pk.active=false; pk.t=0; pk.spr.visible=false;
      addMoney(40); blip(880,1320,0.12); toast('+$40');
    }
  }
  for(const pk of weaponPickups){
    if(!pk.active) continue;
    pk.t+=dt;
    pk.spr.position.y=1.25+Math.sin(pk.t*3.4)*0.18;
    pk.spr.material.rotation=Math.sin(pk.t*2)*0.08;
    if(!player.driving&&Math.hypot(pk.spr.position.x-pp.x,pk.spr.position.z-pp.z)<2.8){
      const w=WEAPONS[pk.weapon];
      const fresh=unlockWeapon(pk.weapon,{equip:true});
      pk.active=false; pk.spr.visible=false;
      blip(740,1180,0.16);
      toast(fresh?w.label+' UNLOCKED':w.label+' EQUIPPED');
    }
  }
  // mission
  const pulse=1+Math.sin(gameT*4)*0.08;
  if(mission.warnT>0) mission.warnT-=dt;
  startMarker.scale.set(pulse,1,pulse);
  destMarker.scale.set(pulse,1,pulse);
  targetMarker.scale.set(pulse*0.85,1,pulse*0.85);
  startMarker.rotation.y+=dt*0.8;
  destMarker.rotation.y+=dt*0.8;
  targetMarker.rotation.y+=dt*0.8;
  if(!mission.active){
    if(distXZ(mission.start,pp)<6) beginMission();
  }else updateMission(dt,pp);
}

function updateFx(dt){
  for(let k=grenades.length-1;k>=0;k--){
    const g=grenades[k]; g.t+=dt;
    g.v.y-=12*dt;
    g.m.position.addScaledVector(g.v,dt);
    g.m.rotation.x+=dt*12; g.m.rotation.z+=dt*9;
    if(g.m.position.y<0.32){
      g.m.position.y=0.32;
      g.v.y=Math.abs(g.v.y)*0.42;
      g.v.x*=0.72; g.v.z*=0.72;
      if(Math.abs(g.v.y)<1.1) g.v.y=0;
    }
    const beforeX=g.m.position.x, beforeZ=g.m.position.z;
    if(collideCircle(g.m.position,0.35)){
      if(Math.abs(g.m.position.x-beforeX)>0.01) g.v.x*=-0.35;
      if(Math.abs(g.m.position.z-beforeZ)>0.01) g.v.z*=-0.35;
    }
    if(g.t>=g.w.fuse){
      const pos=g.m.position.clone();
      scene.remove(g.m);
      grenades.splice(k,1);
      grenadeBlast(pos,g.w);
    }
  }
  for(let k=fx.length-1;k>=0;k--){
    const e=fx[k]; e.t+=dt;
    if(e.kind==='flash'){
      e.m.scale.setScalar(1.6+e.t*5);
      e.m.material.opacity=Math.max(0,0.95-e.t*11);
      if(e.t>0.09){ scene.remove(e.m); fx.splice(k,1); }
    }else if(e.kind==='ball'){
      e.m.scale.setScalar(1+e.t*14);
      e.m.material.opacity=Math.max(0,0.95-e.t*2.2);
      if(e.t>0.5){ scene.remove(e.m); fx.splice(k,1); }
    }else{
      e.m.position.x+=(e.vx||0)*dt;
      e.m.position.z+=(e.vz||0)*dt;
      e.m.position.y+=e.vy*dt;
      e.m.material.opacity=Math.max(0,(e.kind==='dust'?0.34:0.6)-e.t*(e.kind==='dust'?0.58:0.4));
      if(e.t>(e.kind==='dust'?0.75:1.6)){ scene.remove(e.m); fx.splice(k,1); }
    }
  }
  for(let k=tracers.length-1;k>=0;k--){
    const t=tracers[k]; t.t+=dt;
    t.l.material.opacity=1-t.t*8;
    if(t.t>0.13){ scene.remove(t.l); tracers.splice(k,1); }
  }
}

// player headlights
const hl1=new THREE.SpotLight(0xfff3cf,0,68,0.5,0.58,1.2);
const hl2=new THREE.SpotLight(0xfff3cf,0,68,0.5,0.58,1.2);
scene.add(hl1,hl1.target,hl2,hl2.target);

const cDay=new THREE.Color(0x87b5e8), cDusk=new THREE.Color(0xff9a5a), cNight=new THREE.Color(0x101a3a);
const hDayS=new THREE.Color(0xbfd9ff), hNightS=new THREE.Color(0x4d638d);
const hDayG=new THREE.Color(0x6b7a5a), hNightG=new THREE.Color(0x303747);
const skyCol=new THREE.Color(), hsCol=new THREE.Color(), hgCol=new THREE.Color();

const sunVec=new THREE.Vector3();
function updateCycle(dt){
  const a=(gameT/DAY_LEN)*Math.PI*2+0.8;
  const sinA=Math.sin(a);
  const dayness=clamp(sinA*1.6,0,1);
  const dusk=Math.exp(-Math.pow(sinA*2.8,2));
  const nightAmount=clamp((0.4-dayness)/0.4,0,1);
  skyCol.copy(cNight).lerp(cDay,dayness).lerp(cDusk,dusk*0.65);
  scene.background=skyCol; scene.fog.color.copy(skyCol);
  scene.fog.far=430+dayness*160+nightAmount*55;
  renderer.toneMappingExposure=1.14+nightAmount*0.42+dusk*0.08;
  const pp=playerPos();
  sunVec.set(Math.cos(a),Math.abs(sinA)+0.08,0.35).normalize();
  sun.position.copy(pp).addScaledVector(sunVec,220);
  sun.target.position.copy(pp);
  if(sinA>0){ sun.intensity=0.3+dayness*2.5; sun.color.set(0xffffff).lerp(new THREE.Color(0xff8844),dusk); }
  else{ sun.intensity=0.36; sun.color.set(0xa8baff); }
  hsCol.copy(hNightS).lerp(hDayS,dayness); hgCol.copy(hNightG).lerp(hDayG,dayness);
  hemi.color.copy(hsCol); hemi.groundColor.copy(hgCol);
  hemi.intensity=0.56+dayness*0.9+nightAmount*0.14;
  moonFill.position.set(pp.x-90,pp.y+130,pp.z-70);
  moonFill.target.position.copy(pp);
  moonFill.intensity=nightAmount*0.58+dusk*0.08;
  playerFill.position.set(pp.x,6.2,pp.z);
  playerFill.intensity=nightAmount*32+dusk*8;
  // sky bodies follow the player so they read as infinitely far
  sunSpr.position.set(pp.x+Math.cos(a)*900,Math.sin(a)*900,pp.z+250);
  sunSpr.material.opacity=clamp(sinA*2,0,1);
  moonSpr.position.set(pp.x-Math.cos(a)*900,-Math.sin(a)*900,pp.z-250);
  moonSpr.material.opacity=clamp(-sinA*2,0,1)*0.9;
  stars.position.copy(pp).setY(0);
  stars.material.opacity=clamp(-sinA*2.2,0,1)*0.9;
  cloudMat.color.setScalar(0.25+dayness*0.75);
  for(const c of clouds){
    c.position.x+=dt*2.5;
    if(c.position.x>700) c.position.x=-700;
  }
  const night=dayness<0.35;
  if(ui.grade){
    ui.grade.style.opacity=(0.28+dusk*0.12+nightAmount*0.05).toFixed(3);
    ui.vignette.style.opacity=(0.52+dusk*0.06+nightAmount*0.1).toFixed(3);
  }
  bloomPass.strength=night?0.68:0.3;
  updateNightReadableMaterials(nightAmount);
  for(const m of neonMats) m.emissiveIntensity=night?2.6:0.12;
  for(const m of billboardMats) m.emissiveIntensity=night?1.35:0.18+dusk*0.45;
  lampHeadMat.emissiveIntensity=night?2.8:0;
  lampGlowMat.opacity=night?0.58:dusk*0.24;
  facadeSideMat.emissiveIntensity=night?0.85:0;
  glassFacadeMat.emissiveIntensity=night?0.7:0;
  ferrisLightMat.emissiveIntensity=night?2.4:0.3;
  oceanMat.opacity=0.52+dayness*0.18+nightAmount*0.08;
  oceanMat.emissive.set(night?0x0a4f78:0x000000);
  oceanMat.emissiveIntensity=night?0.16:0;
  heliLight.intensity=night?420:0;
  antennaTipMat.emissiveIntensity=Math.sin(gameT*3.5)>0?2.4:0.25;
  const wantHL=night&&player.driving&&player.car.health>0;
  hl1.intensity=hl2.intensity=wantHL?220:0;
  if(wantHL){
    const c=player.car, f=fwdOf(c.th);
    const r=new THREE.Vector3(-f.z,0,f.x);
    hl1.position.copy(c.p).addScaledVector(f,2.2).addScaledVector(r,0.6).setY(0.8);
    hl2.position.copy(c.p).addScaledVector(f,2.2).addScaledVector(r,-0.6).setY(0.8);
    hl1.target.position.copy(hl1.position).addScaledVector(f,30).setY(0);
    hl2.target.position.copy(hl2.position).addScaledVector(f,30).setY(0);
  }
}

// ---------------------------------------------------------------- camera
const camPos=new THREE.Vector3(10,6,-4), camLook=new THREE.Vector3();
let camKick=0;
function updateCamera(dt){
  const k=1-Math.exp(-5.5*dt);
  let want,look;
  if(player.driving){
    const c=player.car, f=fwdOf(c.th);
    const d=9.5+Math.abs(c.speed)*0.12;
    want=c.p.clone().addScaledVector(f,-d).setY(4.6+Math.abs(c.speed)*0.04);
    look=c.p.clone().addScaledVector(f,7).setY(1.4);
  }else{
    const f=fwdOf(player.th);
    want=player.p.clone().addScaledVector(f,-7).setY(3.4);
    look=player.p.clone().addScaledVector(f,4).setY(1.5);
  }
  camPos.lerp(want,k);
  camLook.lerp(look,k);
  camera.position.copy(camPos);
  if(camKick>0){
    camera.position.x+=Math.sin(gameT*51.7)*camKick;
    camera.position.y+=Math.cos(gameT*43.1)*camKick*0.65;
    camKick=Math.max(0,camKick-dt*0.22);
  }
  camera.lookAt(camLook);
  camera.rotation.z+=(player.driving?(player.car.roll||0)*0.36:0)+Math.sin(gameT*37)*camKick*0.28;
  const fovWant=player.driving?62+Math.abs(player.car.speed)*0.38:62;
  camera.fov+=(fovWant-camera.fov)*Math.min(1,4*dt);
  camera.updateProjectionMatrix();
}

// ---------------------------------------------------------------- minimap
function drawMinimap(){
  const g=ui.mini, pp=playerPos();
  const view=320, s=180/view;
  g.fillStyle='#1a2a18'; g.fillRect(0,0,180,180);
  g.drawImage(MAPC,(pp.x+WORLD/2-view/2)*W2C,(pp.z+WORLD/2-view/2)*W2C,
    view*W2C,view*W2C,0,0,180,180);
  const dot=(x,z,col,r)=>{
    const ax=90+(x-pp.x)*s, az=90+(z-pp.z)*s;
    if(ax<4||ax>176||az<4||az>176) {
      // clamp markers to edge
      const cx=clamp(ax,8,172), cz=clamp(az,8,172);
      g.fillStyle=col; g.beginPath(); g.arc(cx,cz,r,0,7); g.fill(); return;
    }
    g.fillStyle=col; g.beginPath(); g.arc(ax,az,r,0,7); g.fill();
  };
  if(!mission.active) dot(mission.start.x,mission.start.z,'#33bbff',5);
  else{
    if(mission.destVisible) dot(mission.dest.x,mission.dest.z,mission.mapColor,5);
    if(mission.targetCar&&mission.targetCar!==player.car)
      dot(mission.targetCar.p.x,mission.targetCar.p.z,'#ff4fa0',5);
  }
  for(const pk of weaponPickups){
    if(pk.active) dot(pk.spr.position.x,pk.spr.position.z,'#ffe27a',3.2);
  }
  for(const c of cars) if(c.type==='police') dot(c.p.x,c.p.z,'#ff4444',3.4);
  for(const pd of peds) if(pd.police&&!pd.dead) dot(pd.p.x,pd.p.z,'#5db8ff',3.2);
  // player arrow
  const th=player.driving?player.car.th:player.th;
  g.save(); g.translate(90,90); g.rotate(-th+Math.PI);
  g.fillStyle='#fff'; g.beginPath();
  g.moveTo(0,-7); g.lineTo(5,6); g.lineTo(-5,6); g.closePath(); g.fill();
  g.restore();
}

// ---------------------------------------------------------------- main loop
const clock=new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),0.05);
  updateRenderQuality(dt);
  if(!started){ composer.render(); return; }
  gameT+=dt;
  if(state==='dead'){
    stateT+=dt;
    if(stateT>3) respawn();
  }else{
    updatePlayer(dt);
  }
  for(const c of cars){
    if(c.type==='traffic') updateTraffic(c,dt);
    else if(c.type==='police'&&state==='play') updatePolice(c,dt);
  }
  updatePeds(dt);
  if(state==='play'){
    updateWantedAndCops(dt);
    updatePickupsAndMission(dt);
  }
  updateFx(dt);
  updateAmbient(dt);
  updateCycle(dt);
  updateCamera(dt);
  if(toastT>0){ toastT-=dt; if(toastT<=0) ui.toast.style.opacity=0; }
  if(storyT>0){ storyT-=dt; if(storyT<=0) ui.storyText.style.opacity=0; }
  const fxSpeed=player.driving?Math.abs(player.car.speed):0;
  ui.speedFX.style.opacity=clamp((fxSpeed-19)/18,0,0.42);
  if(engGain){
    const drv=player.driving&&state==='play';
    const sp=drv?Math.abs(player.car.speed):0;
    engGain.gain.value=drv?0.035+sp/30*0.045:0;
    engOsc.frequency.value=65+sp*5;
    engFilter.frequency.value=280+sp*40;
  }
  drawMinimap();
  composer.render();
}
tick();

// debug/testing hook

  get money(){return money}, get wanted(){return wanted}, get state(){return state},

  weaponPickups};

document.getElementById('screen').addEventListener('click',()=>{
  document.getElementById('screen').style.display='none';
  initAudio();
  started=true;
  toast('Welcome to Vice Beach. Grab the red car.');
});
